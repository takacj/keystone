name: Keystone
options:
  bundleIdPrefix: com.jtakac
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  KeystoneKit:
    path: KeystoneKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Keystone:
    type: application
    platform: macOS
    sources: [App, Features, Resources]
    dependencies:
      - package: KeystoneKit
        product: AzureCLI
      - package: KeystoneKit
        product: AzureAuth
      - package: KeystoneKit
        product: AzureCore
      - package: KeystoneKit
        product: AzureARM
      - package: KeystoneKit
        product: KeyVaultSecrets
      - package: KeystoneKit
        product: Search
      - package: KeystoneKit
        product: Persistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jtakac.keystone
        PRODUCT_NAME: Keystone
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keystone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Keystone.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  KeystoneTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/KeystoneTests]
    dependencies:
      - target: Keystone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jtakac.keystone.tests
  KeystoneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/KeystoneUITests]
    dependencies:
      - target: Keystone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jtakac.keystone.uitests
        TEST_TARGET_NAME: Keystone
schemes:
  Keystone:
    build:
      targets:
        Keystone: all
    test:
      targets: [KeystoneTests]
  KeystoneUI:
    build:
      targets:
        Keystone: all
    test:
      targets: [KeystoneUITests]
