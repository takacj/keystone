name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Don't paste secret values, tokens, tenant or subscription IDs. Security issues go to SECURITY.md.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Can you reproduce it with `-UITestMode -UITestDemo`?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, screenshots or logs (redacted).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keystone version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: az
    attributes:
      label: Azure CLI version (`az version`)
  - type: dropdown
    id: access
    attributes:
      label: Vault access model
      options: [RBAC, Access policies, Both, Unknown]
